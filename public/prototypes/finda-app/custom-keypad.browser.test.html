<!doctype html><html lang="ko"><meta charset="utf-8"><title>Custom keypad regression checks</title>
<style>iframe{width:360px;height:780px;border:0}pre{white-space:pre-wrap}</style>
<iframe title="To-be 커스텀 키패드 검사"></iframe><pre id="report">RUNNING</pre><script type="module">
// Browser regression checks cannot verify the presence of a real OS keyboard.
// Galaxy/Samsung Internet and iOS Safari still require physical-device checks.
const frame=document.querySelector('iframe'),checks=[],runtimeErrors=[];
const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
const app=()=>doc().querySelector('#app');
const field=name=>app().querySelector('[data-field="'+name+'"]');
const state=()=>win().history.state.findaTestEntry.state;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function check(ok,label){checks.push({pass:!!ok,label});if(!ok)throw Error(label);}
async function until(fn,label){for(let i=0;i<400;i++){if(fn())return;await wait(20);}throw Error('Timeout: '+label);}
async function load(screen){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Load timeout')),15000);frame.onload=()=>{clearTimeout(timer);resolve();};frame.src='../../tobe/?screen='+screen;});await until(()=>doc().body.dataset.entryReady==='true','entry ready');win().addEventListener('error',e=>runtimeErrors.push(e.message));await doc().fonts.ready;}
function click(selector){const button=app().querySelector(selector);check(!!button&&!button.disabled,'control '+selector);button.click();}
const key=value=>click('[data-key="'+value+'"]');
const next=()=>click('.cmp-keypad .primary');
function guarded(name){const input=field(name);check(input.inputMode==='none'&&input.readOnly&&!input.disabled,name+' native editing off, field focusable');input.focus();check(doc().activeElement===input,name+' focus retained');check(!!app().querySelector('.cmp-keypad'),name+' custom keypad retained');}
function geometry(label){const keypad=app().querySelector('.cmp-keypad').getBoundingClientRect(),keys=app().querySelector('.cmp-keypad__keys').getBoundingClientRect(),cta=app().querySelector('.cmp-keypad .primary').getBoundingClientRect();check(keypad.bottom<=win().innerHeight+0.2&&keypad.top>=0,label+' keypad fits available viewport');check(keys.bottom<=cta.top&&cta.bottom<=keypad.bottom,label+' keys and CTA do not overlap');check(doc().documentElement.scrollWidth<=win().innerWidth,label+' no horizontal overflow');}
try{
 await load('onboarding-06');guarded('count');
 check(win().getComputedStyle(app().querySelector('[data-keypad-dismiss]')).backgroundColor==='rgba(0, 0, 0, 0)'&&win().getComputedStyle(app().querySelector('.cmp-keypad-screen'),'::after').content==='none','typing does not dim the screen');
 check(app().querySelector('.cmp-keypad .primary').disabled,'empty count blocks next');
 key('2');check(field('count').value==='2','count custom input');next();guarded('principal');
 check(app().querySelector('.cmp-keypad .primary').disabled,'empty principal blocks next');
 for(const digit of '1234567890')key(digit);
 check(field('principal').value==='1,234,567,890','digits 0-9 and comma formatting');
 check(field('principal').parentElement.querySelector('.cmp-input__unit').textContent==='원','won unit retained');
 key('delete');check(field('principal').value==='123,456,789','delete one digit');
 for(let i=0;i<9;i++)key('delete');
 check(field('principal').value===''&&app().querySelector('.cmp-keypad .primary').disabled,'delete to empty disables next');
 click('[data-add="100000000"]');check(field('principal').value==='100,000,000','principal quick add');next();guarded('monthly');
 check(app().querySelector('.cmp-keypad .primary').disabled,'empty monthly blocks next');
 check([...app().querySelectorAll('[data-add]')].map(b=>b.dataset.add).join(',')==='10000000,1000000,500000,100000','monthly quick amounts retained');
 for(const value of ['100000','500000','1000000','10000000'])click('[data-add="'+value+'"]');
 check(field('monthly').value==='11,600,000','monthly quick add and commas');
 check(!app().querySelector('.cmp-keypad .primary').disabled,'filled monthly enables next');
 guarded('principal');click('[data-add="1000000"]');check(field('principal').value==='101,000,000','focus switches custom input target');guarded('monthly');
 const tap=new (win().MouseEvent)('click',{bubbles:true,cancelable:true});check(field('monthly').dispatchEvent(tap),'field tap is not globally cancelled');
 click('.ob-qhead');check(!app().querySelector('.cmp-keypad')&&!!app().querySelector('.cmp-keypad-cta'),'outside tap collapses keypad');
 field('monthly').click();guarded('monthly');check(field('monthly').value==='11,600,000','reopening preserves value');
 click('[data-keypad-dismiss]');check(!app().querySelector('.cmp-keypad')&&!app().querySelector('[data-keypad-dismiss]'),'outside tap closes keypad and its dismissal area together');
 check(!app().querySelector('.cmp-keypad-cta .primary').disabled,'collapsed keypad keeps next enabled for completed values');
 field('monthly').focus();check(doc().activeElement===field('monthly')&&!!app().querySelector('.cmp-keypad'),'keyboard focus reopens custom keypad');
 field('monthly').dispatchEvent(new (win().KeyboardEvent)('keydown',{key:'Escape',bubbles:true,cancelable:true}));
 check(!app().querySelector('.cmp-keypad')&&field('monthly').value==='11,600,000','Escape dismisses without changing amount');
 field('monthly').closest('label').click();guarded('monthly');
 for(const [width,height] of [[320,568],[360,640],[360,780],[412,915]]){frame.style.width=width+'px';frame.style.height=height+'px';win().dispatchEvent(new (win().Event)('resize'));await wait(40);geometry(width+'x'+height);}
 click('[data-action="back"]');check(state().revealed===2&&state().monthly==='11600000','previous field keeps monthly value');guarded('principal');next();guarded('monthly');check(field('monthly').value==='11,600,000','forward field keeps monthly value');
 next();check(state().screen==='07'&&state().principal==='101000000'&&state().monthly==='11600000','next screen retains amounts');
 click('[data-action="back"]');guarded('monthly');check(field('monthly').value==='11,600,000','back from next screen retains monthly');
 await new Promise(resolve=>{frame.onload=resolve;win().location.reload();});await until(()=>doc().body.dataset.entryReady==='true','reload ready');guarded('monthly');check(field('monthly').value==='11,600,000','existing history restore preserves amounts');
 await load('onboarding-08');guarded('amount');check(app().querySelector('.cmp-keypad .primary').disabled,'empty desired amount blocks next');
 click('[data-keypad-dismiss]');check(!app().querySelector('.cmp-keypad')&&app().querySelector('.cmp-keypad-cta .primary').disabled,'desired amount outside dismiss keeps empty next disabled');
 field('amount').focus();check(!!app().querySelector('.cmp-keypad')&&field('amount').readOnly&&field('amount').inputMode==='none','desired amount focus reopens without enabling native editing');
 click('[data-add="1000000"]');key('2');check(field('amount').value==='10,000,002','desired amount custom input');key('delete');check(field('amount').value==='1,000,000','desired amount delete');next();check(state().screen==='09'&&state().amount==='1000000','desired amount next retains value');
 click('[data-action="back"]');guarded('amount');check(field('amount').value==='1,000,000','desired amount back retains value');
 click('[data-no-plan]');check(!app().querySelector('.cmp-keypad')&&!!app().querySelector('input:disabled')&&!app().querySelector('[data-keypad-dismiss]'),'no-plan disabled state retained without dim');click('[data-no-plan]');guarded('amount');check(field('amount').value===''&&app().querySelector('.cmp-keypad .primary').disabled,'unchecking no-plan returns empty guarded input');
 check(runtimeErrors.length===0,'no runtime errors');
}catch(error){checks.push({pass:false,label:String(error.stack||error)});}
const result={passed:checks.filter(c=>c.pass).length,failed:checks.filter(c=>!c.pass),runtimeErrors,physicalDevice:'Galaxy and iOS Safari checks required'};
document.querySelector('#report').textContent=JSON.stringify(result,null,2);document.title=result.failed.length?'FAIL Custom keypad':'PASS Custom keypad';
</script></html>
