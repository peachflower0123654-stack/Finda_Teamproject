<!doctype html><html lang="ko"><meta charset="UTF-8"><title>To-be refinance checks</title>
<style>body{font:13px/1.5 monospace}iframe{width:760px;height:920px;border:0}pre{white-space:pre-wrap}</style>
<pre id="report">RUNNING</pre><iframe title="To-be 대환 연결 검사"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),report=document.querySelector('#report'),checks=[];
const doc=()=>frame.contentDocument,app=()=>doc().querySelector('#app'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(pass,message)=>checks.push({pass:!!pass,message}),note=()=>app().querySelector('[role="status"]')?.textContent;
const expected='이 테스트에서는 구현되지않았어요';
async function settle(){await doc().fonts.ready;await Promise.all([...doc().images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r;})));await wait(30);}
function select(value){const s=doc().querySelector('#screen-review');s.value=value;s.dispatchEvent(new Event('change',{bubbles:true}));}
function near(el,values,label){const a=app().getBoundingClientRect(),r=el.getBoundingClientRect(),s=a.width/360,actual={x:(r.x-a.x)/s,y:(r.y-a.y)/s,w:r.width/s,h:r.height/s};check(Object.entries(values).every(([key,v])=>Math.abs(actual[key]-v)<.2),label);}
async function open(homeState='NoOB_NoMD',keyboard=false){select(`home:Loan:${homeState}`);await settle();app().querySelector('.figma-home-viewport').scrollTop=120;const card=app().querySelector('[aria-label="대환하기"]');if(keyboard)card.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));else card.querySelector('img').click();await settle();return app().querySelector('.asis-refinance');}
function touch(root,type,y){const event=new Event(type,{bubbles:true,cancelable:true});Object.defineProperty(event,'touches',{value:[{clientX:100,clientY:y}]});root.dispatchEvent(event);return event;}
try{
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('load timeout')),10000);frame.onload=()=>{clearTimeout(timer);resolve();};frame.src='index.html?mode=review&screen=home:Loan:NoOB_NoMD';});await settle();
 for(const homeState of ['NoOB_NoMD','OB_NoMD']){
  let root=await open(homeState);check(app().dataset.screen==='Finda_대환'&&root.dataset.nodeId==='4562:15589','right card opens target frame '+homeState);
  check(!note(),'no notice on entry '+homeState);
  const image=root.querySelector('img');check(image.complete&&image.naturalWidth===1080&&image.naturalHeight===2400&&image.src.endsWith('/as-is/assets/refinance.png'),'exact original local image '+homeState);
  near(image,{x:0,y:-33,w:360,h:800},'360x800 image '+homeState);
  near(root.querySelector('.asis-refinance__cta'),{x:16,y:649,w:328,h:54},'CTA geometry '+homeState);
  near(root.querySelector('.asis-refinance__back'),{x:8,y:0,w:40,h:42},'back geometry '+homeState);
  root.querySelector('.asis-refinance__cta').click();check(note()===expected&&app().dataset.screen==='Finda_대환','CTA notice without further navigation '+homeState);
  root.querySelector('.asis-refinance__back').click();check(app().dataset.screen===`scr_11_Home_Loan_${homeState}`&&app().querySelector('.figma-home-viewport').scrollTop===120,'back restores original home and scroll '+homeState);
  check(doc().activeElement?.getAttribute('aria-label')==='대환하기','back restores card focus '+homeState);
  root=await open(homeState,true);check(app().dataset.screen==='Finda_대환','keyboard opens refinance '+homeState);
  const wheel=new WheelEvent('wheel',{deltaY:90,bubbles:true,cancelable:true});root.dispatchEvent(wheel);
  check(note()===expected&&wheel.defaultPrevented,'wheel shows notice and prevents scrolling '+homeState);
  doc().querySelector('[data-preview="back"]').click();check(app().dataset.screen===`scr_11_Home_Loan_${homeState}`,'preview back restores origin '+homeState);
 }
 for(const key of ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' ']){
  const root=await open();root.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));check(note()===expected,'keyboard scroll notice '+key);
 }
 let root=await open();touch(root,'touchstart',400);const move=touch(root,'touchmove',330);
 check(note()===expected&&move.defaultPrevented,'touch scroll notice');
 root=await open();touch(root,'touchstart',400);touch(root,'touchmove',397);check(!note(),'small touch movement stays a tap');
 frame.style.height='640px';frame.contentWindow.dispatchEvent(new Event('resize'));select('existing:refinance');await settle();
 check(app().getBoundingClientRect().height<=608.1,'800px screen fits short desktop viewport');
 frame.style.width='320px';frame.contentWindow.dispatchEvent(new Event('resize'));await settle();
 check(app().getBoundingClientRect().width<=320&&doc().documentElement.scrollWidth<=320,'refinance fits narrow viewport');
 check(app().getBoundingClientRect().height<=640,'complete image fits narrow viewport');
}catch(error){check(false,String(error.stack||error));}
const result={passed:checks.filter(c=>c.pass).length,failed:checks.filter(c=>!c.pass)};report.textContent=JSON.stringify(result,null,2);document.title=result.failed.length?'FAIL To-be refinance':'PASS To-be refinance';
</script></html>
