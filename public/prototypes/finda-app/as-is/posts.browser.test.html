<!doctype html><html lang="ko"><meta charset="UTF-8"><title>As-is post category checks</title>
<style>body{font:13px/1.5 monospace}iframe{width:760px;height:900px;border:0}pre{white-space:pre-wrap}body[data-view]{margin:0}body[data-view] h1,body[data-view] pre{display:none}</style>
<h1>As-is post categories</h1><pre id="report">RUNNING</pre><iframe title="포스트 검사"></iframe>
<script type="module">
import {asIsPostCategories,asIsPostItems} from "./post-instance-data.js";
const frame=document.querySelector("iframe"),report=document.querySelector("#report"),results=[],geometry=[];
const view=new URLSearchParams(location.search).get("view");if(view)document.body.dataset.view=view;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(pass,message)=>results.push({pass:!!pass,message});
const doc=()=>frame.contentDocument,app=()=>doc().querySelector("#asis-app"),pick=id=>app().querySelector('[data-node-id="'+id+'"]');
const bounds=n=>{const a=app().getBoundingClientRect(),b=n.getBoundingClientRect(),s=a.width/360;return {x:(b.x-a.x)/s,y:(b.y-a.y)/s,w:b.width/s,h:b.height/s};};
const near=(n,expected,message)=>{const actual=bounds(n);geometry.push({message,actual,expected});check(Object.entries(expected).every(([k,v])=>Math.abs(actual[k]-v)<.2),message);};
const loaded=async()=>{await doc().fonts.ready;await Promise.all([...doc().images].map(img=>img.complete?Promise.resolve():new Promise(done=>{img.onload=done;img.onerror=done;})));};
const load=screen=>new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error("load timeout")),15000);frame.onload=async()=>{try{await loaded();clearTimeout(timeout);resolve();}catch(e){reject(e);}};frame.src="index.html?screen="+screen;});
const rows=()=>[...app().querySelectorAll("[data-post-id]")];
const tab=name=>app().querySelector('.asis-post-category[data-category="'+name+'"]');
const select=async name=>{tab(name).click();await loaded();};
try{
 await load("posts");
 near(pick("4525:8343"),{x:0,y:28,w:360,h:48},"source header");
 near(pick("4525:8382"),{x:20,y:90,w:320,h:320},"source banner");
 near(pick("4525:8345"),{x:0,y:428,w:360,h:52},"category viewport");
 near(pick("4525:8347"),{x:0,y:726,w:360,h:54},"system navigation");
 check([...app().querySelectorAll(".asis-post-category")].map(n=>n.dataset.category).join("|")===asIsPostCategories.map(c=>c.name).join("|"),"six categories match Figma without insurance");
 const viewport=pick("4525:9450");
 check(viewport.classList.contains("post-chip-group")&&viewport.scrollWidth>viewport.clientWidth,"shared swipe behavior wired");
 const before=viewport.scrollLeft;viewport.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true,cancelable:true}));check(viewport.scrollLeft>before,"keyboard horizontal scroll");
 let checked=0;
 for(const category of asIsPostCategories){
  await select(category.name);
  const expected=asIsPostItems.filter(p=>p.category===category.name).sort((a,b)=>Number(a.id.split("-")[1])-Number(b.id.split("-")[1])),actual=rows();
  check(actual.length===category.count,"category count "+category.name);
  check(actual.map(r=>r.dataset.postId).join("|")===expected.map(p=>p.id).join("|"),"numeric ID sequence "+category.name);
  check(app().querySelectorAll('.asis-post-category[aria-pressed="true"]').length===1&&tab(category.name).getAttribute("aria-pressed")==="true","selected category "+category.name);
  check(app().querySelector(".asis-post-scroll").scrollTop===0,"category switch resets content "+category.name);
  check(app().querySelectorAll('[data-name="Finda As-is/Post/New badge"]').length===0,"no invented NEW flags "+category.name);
  for(const [index,row] of actual.entries()){
   const post=expected[index],title=row.querySelector(".asis-post-instance-title"),image=row.querySelector(".asis-post-instance-crop img"),clip=image.parentElement,slot=clip.parentElement;
   const b=bounds(slot),r=bounds(row),a=bounds(image),c=bounds(clip),m=post.thumbnail.transform;
   check(title.textContent===post.title,"source title "+post.id);
   check(row.dataset.componentId==="4525:9506"&&row.dataset.nodeId===post.nodeId,"existing row component and source instance "+post.id);
   check(Math.abs(b.x-252)<.2&&Math.abs(b.y-r.y-14)<.2&&Math.abs(b.w-88)<.2&&Math.abs(b.h-62)<.2,"source thumbnail moved right "+post.id);
   check(image.complete&&image.naturalWidth>0&&image.src.endsWith(post.thumbnail.src)&&image.src.startsWith(new URL("assets/",frame.src).href),"exact local image "+post.id);
   check(Math.abs(a.w-88/m[0][0])<.3&&Math.abs(a.h-62/m[1][1])<.3&&Math.abs(a.x-c.x+88*m[0][2]/m[0][0])<.3&&Math.abs(a.y-c.y+62*m[1][2]/m[1][1])<.3,"source crop "+post.id);
   check(title.scrollHeight<=75&&bounds(title).y+bounds(title).h<=r.y+r.h,"source title fits row "+post.id);
   checked++;
  }
  const scroller=app().querySelector(".asis-post-scroll");scroller.scrollTop=999999;
  check(bounds(actual.at(-1)).y+bounds(actual.at(-1)).h<=726.2,"last post reachable "+category.name);
  near(pick("4525:9537"),{x:300,y:662,w:40,h:40},"top button at end "+category.name);
  pick("4525:9537").click();await wait(800);check(scroller.scrollTop===0,"scroll to top "+category.name);
 }
 check(checked===433,"all 433 source instances checked");
 const first=rows()[0];first.click();check(app().dataset.screen==="posts"&&!!app().querySelector('[role="status"]'),"detail remains scoped");
 await load("all");const all=app().querySelector(".asis-tab-scroll");all.scrollTop=1300;app().querySelector('[data-name="cmp_All_MenuRow"][aria-label="핀다포스트"]').click();
 check(app().dataset.screen==="posts"&&rows()[0].dataset.postId==="T-01","All menu opens initial usage category");
 pick("4525:8373").click();check(app().dataset.screen==="all"&&app().querySelector(".asis-tab-scroll").scrollTop===1300,"back restores All scroll");
 frame.style.width="320px";frame.style.height="640px";await load("posts");
 check(app().getBoundingClientRect().width<=320.1&&doc().documentElement.scrollWidth<=320,"320px viewport fits");
 if(view){frame.style.width="760px";frame.style.height="900px";await load("posts");if(view!=="top")await select(view==="bottom"?"사용팁":view);if(view==="bottom")app().querySelector(".asis-post-scroll").scrollTop=999999;}
}catch(error){check(false,String(error.stack||error));}
const result={passed:results.filter(r=>r.pass).length,failed:results.filter(r=>!r.pass),geometry};report.textContent=JSON.stringify(result,null,2);document.title=result.failed.length?"FAIL Posts":"PASS Posts";
</script></html>
